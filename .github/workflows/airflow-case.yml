name: Airflow case study

on:
  push:
    paths:
      - "airflow-case-v2/**"
      - ".github/workflows/airflow-case.yml"
  pull_request:
    paths:
      - "airflow-case-v2/**"
      - ".github/workflows/airflow-case.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airflow-case-v2
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bind mounts for the runner user
        run: mkdir -p logs data/output && echo "AIRFLOW_UID=$(id -u)" > .env
      - name: Build image and initialize Airflow
        run: docker compose up --build --abort-on-container-exit --exit-code-from airflow-init airflow-init
      - name: Run unit tests and validate DAG parsing with Airflow's DagBag
        run: docker compose run --rm airflow-webserver bash -c "python -m pytest -q"
      - name: Stop services
        if: always()
        run: docker compose down -v
