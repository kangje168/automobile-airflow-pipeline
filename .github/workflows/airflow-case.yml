name: Airflow case study

on:
  push:
    paths:
      - "airflow-case-v2/**"
      - ".github/workflows/airflow-case.yml"
  pull_request:
    paths:
      - "airflow-case-v2/**"
      - ".github/workflows/airflow-case.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airflow-case-v2
    steps:
      - uses: actions/checkout@v4
      - name: Build image and initialize Airflow
        run: docker compose up --build --abort-on-container-exit --exit-code-from airflow-init airflow-init
      - name: Run unit tests and parse the DAG with Airflow
        run: docker compose run --rm airflow-webserver pytest -q
      - name: Stop services
        if: always()
        run: docker compose down -v
